services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sgeafi
      POSTGRES_PASSWORD: sgeafi
      POSTGRES_DB: sgeafi_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgeafi -d sgeafi_test"]
      interval: 2s
      timeout: 5s
      retries: 20
